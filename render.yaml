services:
  - type: web
    name: sanjeevani-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GOOGLE_CLOUD_PROJECT
        value: sanjeevani-ai-health-national
      - key: BIGQUERY_DATASET
        value: indian_public_health_surveillance
      - key: FIREBASE_PROJECT_ID
        value: sanjeevani-health-iot
      - key: FIREBASE_DATABASE_URL
        value: https://sanjeevani-health-iot-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: OPEN_METEO_API_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: WHO_GHO_API_URL
        value: https://ghoapi.azureedge.net/api/Dimension/COUNTRY/DimensionValues
      - key: DATA_GOV_IN_API_URL
        value: https://api.data.gov.in/resource
